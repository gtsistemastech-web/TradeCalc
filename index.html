<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Risk & Reward Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 13L9 7L14 12L21 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 5H15M21 5V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h1>TradeCalc Pro</h1>
            </div>
            <p>Gerenciador de Risco e R-Multiples</p>
        </header>

        <main class="dashboard">
            <section class="panel input-panel">
                <h2>Parâmetros da Operação</h2>
                
                <div class="form-group">
                    <label>Direção</label>
                    <div class="direction-toggle">
                        <input type="radio" id="dir-long" name="direction" value="long" checked>
                        <label for="dir-long" class="btn-long">Compra (Long)</label>
                        
                        <input type="radio" id="dir-short" name="direction" value="short">
                        <label for="dir-short" class="btn-short">Venda (Short)</label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="asset-preset">Ativo</label>
                        <select id="asset-preset">
                            <option value="custom">Personalizado</option>
                            <option value="20">Nasdaq (NQ) - $20/pt</option>
                            <option value="50">S&P 500 (ES) - $50/pt</option>
                            <option value="5">S&P 500 Micro (MES) - $5/pt</option>
                            <option value="5">Dow Jones (YM) - $5/pt</option>
                            <option value="25">DAX Alemanha (FDAX) - €25/pt</option>
                            <option value="1000">Nikkei 225 (NKD) - ¥1.000/pt</option>
                            <option value="1">UK100 (FTSE 100) - £1/pt</option>
                            <option value="10">Hong Kong (HK50) - HK$10/pt</option>
                            <option value="1">Bitcoin (BTC) - $1/pt</option>
                            <option value="10">Forex (Lote Padrão) - $10/pip</option>
                            <optgroup label="Ações dos EUA ($1/pt por ação)">
                                <option value="1" data-price="230">AAPL (Apple)</option>
                                <option value="1" data-price="430">MSFT (Microsoft)</option>
                                <option value="1" data-price="140">NVDA (NVIDIA)</option>
                                <option value="1" data-price="230">AMZN (Amazon)</option>
                                <option value="1" data-price="270">TSLA (Tesla)</option>
                                <option value="1" data-price="180">GOOGL (Alphabet)</option>
                                <option value="1" data-price="620">META (Meta)</option>
                                <option value="1" data-price="170">AMD (AMD)</option>
                                <option value="1" data-price="1100">NFLX (Netflix)</option>
                                <option value="1" data-price="72">KO (Coca-Cola)</option>
                                <option value="1" data-price="115">DIS (Disney)</option>
                                <option value="1" data-price="270">JPM (JPMorgan)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="point-value">Valor do Ponto/Tick (moeda do ativo)</label>
                        <input type="number" id="point-value" step="0.01" value="20" min="0">
                    </div>
                    <div class="form-group" id="stock-price-group" hidden>
                        <label for="stock-price">Preço da Ação ($)</label>
                        <input type="number" id="stock-price" step="0.01" min="0" placeholder="Ex: 230">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="position-size">Tamanho da Posição <span id="position-size-unit">(Lotes)</span></label>
                        <input type="number" id="position-size" step="0.01" value="1" min="0">
                    </div>
                    <div class="form-group">
                        <label for="account-balance">Saldo da Conta ($) <span class="optional">Opcional</span></label>
                        <input type="number" id="account-balance" step="1" placeholder="Ex: 10000" min="0">
                    </div>
                </div>

                <div class="form-row" id="risk-row" hidden>
                    <div class="form-group">
                        <label for="risk-percent">Risco Desejado (%) <span class="optional">para sugerir posição</span></label>
                        <input type="number" id="risk-percent" step="0.1" value="1" min="0.1" max="5">
                    </div>
                    <div class="form-group">
                        <label for="suggested-size">Sugestão de Posição (ações)</label>
                        <input type="number" id="suggested-size" step="0.01" min="0" readonly>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="entry-price">Preço de Entrada</label>
                        <input type="number" id="entry-price" step="any" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="stop-price">Preço de Stop Loss</label>
                        <input type="number" id="stop-price" step="any" placeholder="0.00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="spread-value">Spread <span class="optional">veja no Painel Bid/Ask</span></label>
                        <div class="spread-row">
                            <input type="number" id="spread-value" step="0.0001" min="0" value="0" placeholder="0">
                            <select id="spread-unit">
                                <option value="pts" selected>Pontos</option>
                                <option value="pct">% do preço</option>
                                <option value="usd">$ (ação/lote)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel results-panel">
                <h2>Resumo do Risco (1R)</h2>
                <div class="summary-cards">
                    <div class="card risk-points">
                        <span class="label">Risco por Lote</span>
                        <span class="value" id="res-risk-points">0.00 pts</span>
                    </div>
                    <div class="card risk-usd">
                        <span class="label">Risco Financeiro Total</span>
                        <span class="value negative" id="res-risk-usd">$0.00</span>
                    </div>
                    <div class="card risk-pct">
                        <span class="label">Risco da Conta</span>
                        <span class="value" id="res-risk-pct">-%</span>
                    </div>
                    <div class="card position-value">
                        <span class="label">Valor da Posição</span>
                        <span class="value" id="res-position-value">—</span>
                    </div>
                </div>

                <h2>Projeção de Alvos (Saídas)</h2>
                <div class="table-container">
                    <table id="targets-table">
                        <thead>
                            <tr>
                                <th>Alvo</th>
                                <th>R-Multiple</th>
                                <th>Preço Saída</th>
                                <th>Lucro ($)</th>
                                <th>Retorno (%)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Gerado via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
